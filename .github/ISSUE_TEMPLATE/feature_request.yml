name: Feature request
description: An idea to make teaching Pixel better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How it could work. If it changes how Pixel learns, how could the benchmark (bench.simulate) show it helps?
